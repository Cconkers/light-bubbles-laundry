  <!--
    Cesta de ropa — fuente editable.
    Colores vía CSS custom properties (LaundryBasket.astro / tone):
      --lb-basket-body        cuerpo claro
      --lb-basket-body-dark   sombra / volumen del cuerpo
      --lb-basket-vent        rejilla + ropa (principal)
      --lb-basket-vent-shadow sombreado de rejilla/ropa
      --lb-basket-stroke      contorno
      --lb-basket-shine       brillo
  -->
  <style>
    .lb-b-body { fill: var(--lb-basket-body, #f8a460); }
    .lb-b-body-dark { fill: var(--lb-basket-body-dark, #ff7c11); }
    .lb-b-vent { fill: var(--lb-basket-vent, #6700ac); }
    .lb-b-vent-shadow { fill: var(--lb-basket-vent-shadow, #a84383); }
    .lb-b-stroke { fill: var(--lb-basket-stroke, #002291); }
    .lb-b-shine { fill: var(--lb-basket-shine, #ffffff); }
  </style>

