name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # npm install (not ci) because package-lock.json is not committed
      - name: Install dependencies
        run: npm install

      - name: Type check (astro check)
        run: npm run check

      - name: Build production site
        run: npm run build
